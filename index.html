<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>I-Fix-It Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Mono:wght@400;500&family=Rubik:ital,wght@0,400;0,500;0,700;1,500&display=swap">
<style>
/* Layout concept: a repair bench. Teal cutting-mat ground, yellow carbon-copy work orders, devices sitting on the mat. */
:root{
  color-scheme:dark;
  --mat:#0f3b3d; --mat-deep:#0a2a2c; --grid:rgba(255,255,255,.06);
  --paper:#ffe9a3; --paper-2:#fff6d6; --ink:#1a2422;
  --stamp:#e4472b; --ok:#35d08f; --warn:#ffb224; --text:#e8f3f0; --dim:#9dbab5;
  --steel:#c4ccd0; --line:rgba(255,255,255,.16);
  --f-display:"Bungee","Arial Black",Impact,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--mat-deep);color:var(--text);font:400 16px/1.5 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;background-color:var(--mat)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
#app{max-width:1080px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase}

/* sign */
.sign{display:flex;flex-direction:column;gap:6px}
.sign h1{font:400 clamp(30px,7vw,56px)/1 var(--f-display);color:var(--paper);letter-spacing:.01em}
.sign h1 span{color:var(--text)}
.sign p{color:var(--dim);max-width:60ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{background:var(--paper);color:var(--ink);border:0;border-radius:6px;padding:10px 18px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line);box-shadow:none}
.btn.red{background:var(--stamp);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{background:var(--mat-deep);border:1.5px solid var(--line);color:var(--text);border-radius:6px;padding:10px 12px;font:inherit;min-width:0;width:min(280px,100%)}
.note{color:var(--warn);font-size:14px}

/* map */
.map{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{width:100%;text-align:left;background:var(--paper);color:var(--ink);border:0;border-radius:4px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;min-height:128px;position:relative;
  box-shadow:0 4px 0 rgba(0,0,0,.3);background-image:repeating-linear-gradient(transparent 0 23px,rgba(26,36,34,.09) 23px 24px)}
.card h3{font:700 18px/1.2 var(--f-body)}
.card .label{opacity:.7}
.card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;font:500 13px var(--f-mono)}
.card.locked{background:transparent;color:var(--dim);border:1.5px dashed var(--line);box-shadow:none;background-image:none;cursor:not-allowed}
.card.shop{background:var(--mat-deep);color:var(--text);border:2px solid var(--paper);background-image:none}
.card.shop h3{font:400 20px var(--f-display);color:var(--paper)}
.stars{color:var(--stamp);letter-spacing:2px}
.card.shop .stars,.dark .stars{color:var(--warn)}

/* play */
.hud{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;border-bottom:1.5px solid var(--line);padding-bottom:12px}
.hud h2{font:400 clamp(18px,3.4vw,24px) var(--f-display);color:var(--paper);margin-right:auto}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat b{font:500 20px var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font:500 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.play{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:800px){.play{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0;display:flex;flex-direction:column;gap:16px;align-items:center;padding:8px 0}
.ticket{min-width:0;background:var(--paper);color:var(--ink);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.ticket h3{font:700 17px var(--f-body)}
.ticket .prob{font-size:15px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{font-size:14px;line-height:1.4;padding:7px 9px;border-radius:4px;background:rgba(26,36,34,.07);border-left:4px solid rgba(26,36,34,.3)}
.log li.good{border-color:#149a63;background:rgba(53,208,143,.22)}
.log li.bad{border-color:var(--stamp);background:rgba(228,71,43,.16)}
.log li.clue{border-color:#b97a00;background:rgba(255,178,36,.28)}
.log li.hint{border-style:dashed;border-color:#3a5fd0;background:rgba(58,95,208,.12)}
.log li b{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;display:block}
.tbtn{background:var(--ink);color:var(--paper-2);border:0;border-radius:5px;padding:8px 12px;font-weight:500;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--mat-deep);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--text)}
.chip:hover{border-color:var(--paper)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}
@keyframes pop{from{transform:scale(.6) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
@media (prefers-reduced-motion:no-preference){.shake{animation:shake .35s}.stamp{animation:pop .35s ease-out}}

/* devices */
.laptop{width:min(560px,100%)}
.lid{background:#16191d;border-radius:14px 14px 0 0;padding:12px 12px 14px}
.screen{background:#e7edf4;color:#18202c;border-radius:4px;min-height:300px;display:flex;flex-direction:column;font-size:13px;line-height:1.35;position:relative}
.screen.off{background:#05070a;align-items:center;justify-content:center;color:#3a4552}
.base{background:linear-gradient(#cfd5d9,#98a1a7);border-radius:0 0 14px 14px;padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:#18202c}
.key{background:#262b33;color:#fff;border:0;border-radius:5px;padding:7px 10px;font:500 11px var(--f-mono);box-shadow:0 2px 0 #000;display:inline-flex;gap:6px;align-items:center}
.key:active{transform:translateY(2px);box-shadow:none}
.led{width:8px;height:8px;border-radius:50%;background:#444;display:inline-block}
.led.g{background:#2fe08f;box-shadow:0 0 6px #2fe08f}.led.r{background:#ff3b30;box-shadow:0 0 6px #ff3b30}.led.a{background:#ffb224;box-shadow:0 0 6px #ffb224}
@media (prefers-reduced-motion:no-preference){.led.blink{animation:blink .7s infinite}}
.pwr{margin-left:auto;width:34px;height:34px;border-radius:50%;border:2px solid #555;background:#262b33;color:#fff;font-size:15px;line-height:1}
.bar{background:#fff;border-bottom:1px solid #c9d2dd;padding:6px 10px;display:flex;gap:8px;align-items:center;font-weight:500}
.taskbar{margin-top:auto;background:#20283a;color:#cfd8ea;padding:5px 10px;font:500 11px var(--f-mono);display:flex;justify-content:space-between}
.body{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
.win{background:#fff;border:1px solid #b9c3d0;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.18);text-align:left;padding:0;color:#18202c;width:100%;display:block}
.win .tt{background:#dfe5ee;padding:6px 10px;font-weight:700;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;gap:8px}
.win .ct{padding:10px}
.win.frozen{opacity:.75;filter:grayscale(1)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #7d8ba0;border-top-color:transparent;border-radius:50%;vertical-align:-2px}
@media (prefers-reduced-motion:no-preference){.spin{animation:spin 1s linear infinite}}
.rows{display:flex;flex-direction:column}
.r{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border:0;border-top:1px solid #e3e8ef;background:#fff;color:#18202c;text-align:left;width:100%;font-size:13px;align-items:center}
.r.sel{background:#cfe0ff}
.r .st-bad{color:#c22e17;font-weight:700}
.sbtn{background:#2f5fe0;color:#fff;border:0;border-radius:5px;padding:7px 12px;font-weight:500;font-size:13px}
.sbtn.gray{background:#e3e8ef;color:#18202c}
.sbtn.danger{background:#c22e17}
.icon{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#18202c;width:76px}
.icon i{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:22px;color:#fff}
.tog{width:40px;height:22px;border-radius:11px;background:#aeb8c6;position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:#2fb673}.tog.on::after{left:20px}
.tablet{width:min(500px,100%);background:#111;border-radius:22px;padding:12px}
.tablet .screen{border-radius:10px;min-height:340px}
.phone{width:min(270px,100%);background:#111;border-radius:30px;padding:10px}
.phone .screen{border-radius:22px;min-height:440px;background:#1b1530;color:#f1ecff}
.sbar{display:flex;justify-content:space-between;padding:5px 12px;font:500 11px var(--f-mono);opacity:.85}
.homebar{align-self:center;margin:8px;width:90px;height:22px;border-radius:11px;border:0;background:rgba(0,0,0,.18);color:inherit;font:500 10px var(--f-mono)}
.phone .homebar{background:rgba(255,255,255,.18)}
.art{width:150px;height:150px;border-radius:14px;background:conic-gradient(from 40deg,#ff8a3c,#e4472b,#7a3cff,#35d08f,#ff8a3c);align-self:center}
.eq{display:flex;gap:4px;height:26px;align-items:flex-end;justify-content:center}
.eq i{width:5px;background:#35d08f;height:40%}
@media (prefers-reduced-motion:no-preference){.eq i{animation:eq .8s infinite}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}}
.cc{background:#2b2447;border-radius:14px;margin:0 10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.cc .r{background:#3a3160;color:#f1ecff;border:0;border-radius:8px}
.cc .r.sel{background:#5a47b8}
.vol{height:8px;border-radius:4px;background:#3a3160;overflow:hidden}.vol i{display:block;height:100%;background:#35d08f}
.side{display:flex;flex-direction:column;gap:8px}
.duo{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-start;width:100%}
.router{background:#f1f3f5;color:#18202c;border-radius:10px;padding:14px;width:min(250px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:0 5px 0 #8b949a}
.lights{display:flex;justify-content:space-between;background:#262b33;color:#fff;border:0;border-radius:6px;padding:10px;width:100%;font:500 10px var(--f-mono)}
.lights span{display:flex;flex-direction:column;align-items:center;gap:5px}
.cable{display:flex;align-items:center;gap:0;flex-wrap:wrap;justify-content:center;row-gap:8px}
.cable .wire{width:26px;height:4px;background:#222}
.part{background:#f1f3f5;color:#18202c;border:0;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:500;box-shadow:0 3px 0 #8b949a;display:inline-flex;gap:8px;align-items:center}
.printer{background:#f1f3f5;color:#18202c;border-radius:10px;padding:12px;width:min(240px,100%);display:flex;flex-direction:column;gap:8px;box-shadow:0 5px 0 #8b949a}
.pdisp{background:#0d2b1c;color:#58f0a6;border:0;border-radius:4px;padding:8px;font:500 12px var(--f-mono);text-align:left;width:100%}
.scam{background:#c5160a;color:#fff;border:4px solid #ffe600;border-radius:6px;padding:12px;max-width:330px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.scam h4{margin:0;font:400 18px var(--f-display);color:#ffe600}
.scamwrap{flex:1;display:flex;padding:12px;background:#f3d9d6}
.p0{justify-content:center;align-items:center}.p1{justify-content:flex-start;align-items:flex-start}.p2{justify-content:flex-end;align-items:flex-end}
.tabs{display:flex;background:#cfd6df;padding:5px 6px 0;gap:4px}
.tab{background:#e7edf4;border-radius:6px 6px 0 0;padding:5px 8px;font-size:12px;display:flex;gap:8px;align-items:center;min-width:0}
.tab.on{background:#fff;font-weight:700}
.tab button{border:0;background:#dfe5ee;color:#18202c;border-radius:50%;width:20px;height:20px;line-height:1;font-size:12px;padding:0}
.kbd{display:flex;gap:4px;flex-wrap:wrap;flex:1}

/* result / cert */
.panel{background:var(--paper);color:var(--ink);border-radius:4px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 4px 0 rgba(0,0,0,.3);max-width:640px;width:100%;align-self:center;position:relative}
.panel h2{font:400 26px var(--f-display)}
.stamp{position:absolute;top:18px;right:18px;border:4px solid var(--stamp);color:var(--stamp);font:400 22px var(--f-display);padding:2px 12px;border-radius:6px;transform:rotate(-8deg);opacity:.9}
.lines{display:flex;flex-direction:column}
.lines div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed rgba(26,36,34,.35);font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.lines .tot{font-size:20px;border-bottom:0}
.tip{background:rgba(26,36,34,.08);padding:12px;border-radius:4px;font-size:15px}
.cert{background:var(--paper-2);color:var(--ink);border:3px solid var(--ink);outline:2px solid var(--ink);outline-offset:-10px;padding:36px 28px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;max-width:760px;width:100%;align-self:center}
.cert h2{font:400 clamp(22px,5vw,38px)/1.1 var(--f-display)}
.cert .who{font:italic 500 clamp(28px,6vw,46px)/1.1 var(--f-body);border-bottom:2px solid var(--ink);padding:0 24px 4px;overflow-wrap:anywhere}
.cert .rank{font:400 20px var(--f-display);color:var(--stamp)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 18px;width:100%;text-align:left;font:500 13px var(--f-mono)}
.cgrid div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted rgba(26,36,34,.4)}
.sigs{display:flex;gap:24px;flex-wrap:wrap;justify-content:space-around;width:100%;margin-top:14px}
.sigs div{border-top:1.5px solid var(--ink);padding-top:4px;min-width:150px;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}

/* shop */
.shop{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:800px){.shop{grid-template-columns:minmax(0,1fr)}}
.counter{min-width:0;display:flex;flex-direction:column;gap:14px}
.cust{display:flex;gap:14px;align-items:flex-start}
.face{font-size:64px;line-height:1;flex:none}
.bubble{background:#fff;color:var(--ink);border-radius:4px 16px 16px 16px;padding:12px 14px;min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.bubble .qa{font-size:14px;border-top:1px dashed #b9c3d0;padding-top:6px}
.pat{height:12px;background:var(--mat-deep);border:1.5px solid var(--line);border-radius:6px;overflow:hidden}
.pat i{display:block;height:100%;background:var(--ok);transition:width .25s linear}
.opts{display:grid;gap:8px}
.opt{background:var(--mat-deep);border:1.5px solid var(--line);color:var(--text);border-radius:6px;padding:10px 12px;text-align:left;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--paper)}
.opt.fix{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:500}
.opt:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.sidebox{min-width:0;border:1.5px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--mat-deep)}
.up{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.up small{color:var(--dim);display:block}
.outcome{border-radius:6px;padding:14px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;gap:8px}

/* first-person shop */
.shopfp{display:flex;flex-direction:column;gap:14px;max-width:880px;width:100%;align-self:center;min-width:0}
.fp{position:relative;overflow:hidden;aspect-ratio:16/9;max-width:100%;border-radius:8px;border:3px solid #06191a;font-size:clamp(8.5px,2.1vw,19px);background:#1b5557}
.fwall{position:absolute;inset:0 0 40% 0;background:linear-gradient(#1d5c5e,#174b4d)}
.ffloor{position:absolute;left:-30%;right:-30%;bottom:0;height:40%;transform-origin:bottom;transform:perspective(18em) rotateX(48deg);
  background:repeating-conic-gradient(#d9c9a6 0 25%,#b79f72 0 50%) 0 0/5em 5em}
.fdoor{position:absolute;left:6%;bottom:40%;width:7em;height:11.5em;background:#7a4a2a;border:.4em solid #4c2c16;border-bottom:0;display:flex;flex-direction:column;align-items:center;padding-top:.8em;gap:.6em}
.fdoor::before{content:"";width:4.4em;height:4.6em;background:linear-gradient(#ffcf7a,#ff9a5a);border:.25em solid #4c2c16}
.fdoor span{background:#fff;color:#c22e17;font:500 .85em var(--f-mono);padding:.1em .5em;border-radius:.2em}
.fwin{position:absolute;right:7%;top:13%;width:12em;height:6.6em;border:.45em solid #e9e2cf;background:linear-gradient(#ffb36b 0 45%,#ff7e5f 70%,#7a4a6a)}
.fwin::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:.3em;background:#e9e2cf}
.fneon{position:absolute;top:5%;left:50%;transform:translateX(-50%);font:400 1.9em var(--f-display);color:#3f7d7b;white-space:nowrap;border:.12em solid currentColor;border-radius:.4em;padding:0 .5em}
.fneon.l1,.fneon.l2,.fneon.l3{color:#ffe27a;text-shadow:0 0 .4em #ffb224;box-shadow:0 0 .6em #ffb224}
.fneon.l2{color:#ff9ad1;text-shadow:0 0 .5em #ff4fa3;box-shadow:0 0 .8em #ff4fa3}
.fneon.l3{color:#8dfcff;text-shadow:0 0 .6em #29d9ff,0 0 1.2em #29d9ff;box-shadow:0 0 1.2em #29d9ff}
.fshelf{position:absolute;right:7%;bottom:44%;width:12.9em;display:flex;gap:.5em;align-items:flex-end;border-bottom:.4em solid #4c2c16;padding:0 .4em}
.fshelf i{flex:1;background:#c4ccd0;height:1.6em;border-radius:.15em}.fshelf i:nth-child(2n){height:2.3em;background:#ffe27a}.fshelf i:nth-child(3n){background:#e4472b}
.fchairs{position:absolute;left:23%;bottom:40%;display:flex;gap:.5em}
.fchairs i{width:2.3em;height:3.4em;background:#35d08f;border-radius:.8em .8em .2em .2em;border-bottom:1em solid #1f8a5e}
.fcust{position:absolute;left:50%;margin-left:-5em;bottom:20%;width:10em;z-index:2;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;transform-origin:bottom center;font-size:1em}
.fhead{font-size:6em;line-height:1.05}
.fbody{width:9em;height:6.5em;border-radius:4em 4em 0 0;margin-top:-.6em}
.fpat{width:8em;height:.8em;background:#06191a;border:.12em solid #fff;border-radius:.4em;overflow:hidden;margin-bottom:.3em}
.fpat i{display:block;height:100%;background:var(--ok);transition:width .25s linear}
@keyframes walkin{from{transform:translate(-15em,-4em) scale(.3)}to{transform:none}}

<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ---------- helpers ---------- */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmtT = s => Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const starStr = n => '★'.repeat(n)+'☆'.repeat(3-n);
const good = m => ({k:'good',m}), bad = m => ({k:'bad',m}), info = m => ({k:'info',m}), clue = m => ({k:'clue',m});

const KEY = 'ifixit-v1';
let SAVE = {name:'', best:[], shopBest:0};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s==='object') SAVE = Object.assign(SAVE, s); } catch(e){}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(SAVE)); } catch(e){} };

/* ---------- sound ---------- */
let AC = null, mute = false;
function tone(f,d,type,v,when){ if (mute) return; try { AC = AC || new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'triangle'; o.frequency.value=f; const s=AC.currentTime+(when||0); g.gain.setValueAtTime(v||.07,s); g.gain.exponentialRampToValueAtTime(.0001,s+d); o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s+d+.02); } catch(e){} }
function sfx(k){ if(k==='good'){tone(660,.12);tone(880,.18,'triangle',.07,.1);} else if(k==='bad'){tone(150,.28,'sawtooth',.05);} else if(k==='clue'){tone(990,.12,'sine',.08);} else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.08,i*.12));} else tone(420,.04,'square',.025); }

/* ---------- device builders ---------- */
const laptop = (screen, base, cls) => `<div class="laptop"><div class="lid"><div class="screen ${cls||''}">${screen}</div></div><div class="base">${base||''}</div></div>`;
const tog = on => `<span class="tog ${on?'on':''}"></span>`;

/* ---------- levels ---------- */
const LEVELS = [
{ title:'Frozen Screen', dev:'Laptop', par:60,
  prob:'You are writing an essay and the app stops responding. The mouse still moves, but clicking the essay does nothing.',
  hints:['Clicking more will not help. Is there a tool that shows every app that is running?','Open Task Manager with the key combo, pick the app that says Not responding, and end it.','After the app closes, open it again to see if your work was recovered.'],
  tip:'End only the frozen app, not the whole computer. On a Chromebook the Task Manager shortcut is Search + Esc. Save often so a freeze costs you nothing.',
  init:()=>({clicks:0}),
  view(st){
    const procs=[['essay','Essay Writer','Not responding'],['web','Web Browser','Running'],['music','Music Player','Running'],['system','System','Running']];
    let s='';
    if(!st.killed){
      s+=`<div class="body"><button class="win frozen" data-a="win"><div class="tt"><span>Essay Writer (Not Responding)</span><span>— □ ✕</span></div><div class="ct"><span class="spin"></span> My essay about volcanoes is almost done and I have not sav</div></button>`;
      if(st.tm) s+=`<div class="win"><div class="tt"><span>Task Manager</span><button class="sbtn gray" data-a="tmx">Close</button></div><div class="rows">${procs.map(p=>`<button class="r ${st.sel===p[0]?'sel':''}" data-a="sel" data-v="${p[0]}"><span>${p[1]}</span><span class="${p[2]==='Running'?'':'st-bad'}">${p[2]}</span></button>`).join('')}</div><div class="ct"><button class="sbtn danger" data-a="end">End task</button></div></div>`;
      s+=`</div>`;
    } else {
      s+=`<div class="body"><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="icon" data-a="open"><i style="background:#2f5fe0">✎</i>Essay Writer</button><button class="icon" data-a="other"><i style="background:#e4472b">♪</i>Music Player</button></div></div>`;
    }
    s+=`<div class="taskbar"><span>Start</span><span>10:42</span></div>`;
    return laptop(s, `<button class="key" data-a="esc">Esc</button><button class="key" data-a="tm">Ctrl + Shift + Esc</button><button class="pwr" data-a="power" aria-label="Power button">⏻</button>`)
      + `<div class="chips"><button class="chip" data-a="wait">Wait 30 seconds</button></div>`;
  },
  act(st,a,v){
    if(a==='win'){ st.clicks++; return st.clicks>=3 ? bad('Clicking over and over piles up more commands for a frozen app. Stop clicking and try something else.') : info('No response. The window is frozen.'); }
    if(a==='wait'){ if(!st.waited){st.waited=1; return clue('You waited 30 seconds. Still frozen. Good first move, because sometimes an app is only busy.');} return info('Still frozen. Time to act.'); }
    if(a==='esc') return info('Esc did not help this time.');
    if(a==='tm'){ st.tm=1; return good('Task Manager opened. It lists every app that is running.'); }
    if(a==='tmx'){ st.tm=0; return null; }
    if(a==='sel'){ st.sel=v; return null; }
    if(a==='end'){ if(!st.sel) return info('Select an app in the list first.');
      if(st.sel==='essay'){ st.killed=1; return good('Essay Writer closed. The rest of the laptop works again.'); }
      if(st.sel==='system') return bad('Never end System. That can crash the whole computer.');
      return bad('That app was working fine. Only end the one that says Not responding.'); }
    if(a==='other') return info('That app works. Now check on your essay.');
    if(a==='open'){ st.done=1; return good('Essay Writer reopened and AutoRecover brought back your work.'); }
    if(a==='power') return bad('Holding the power button forces a shutdown. You lose unsaved work in every app. Keep that for when nothing else responds.');
  }
},
{ title:'No Wi-Fi', dev:'Tablet', par:70,
  prob:'Your tablet worked at home this morning. Now at school it will not load any page, and it does not even show Wi-Fi networks.',
  hints:['Look at the small icons at the top of the tablet screen. One of them is unusual.','Airplane mode switches off every wireless signal. Turn it off in Settings.','Turn Wi-Fi on, join the network you know, then open the browser to prove it works.'],
  tip:'Read the status icons first. Join only networks you know. After any fix, test it to confirm the problem is really gone.',
  init:()=>({page:'home',air:true,wifi:false,conn:false}),
  view(st){
    let b='';
    const sb=`<div class="sbar"><span>9:15</span><span>${st.air?'✈ ':''}${st.conn?'Wi-Fi ▂▄▆ ':''}82%</span></div>`;
    if(st.page==='home') b=`<div class="body"><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="icon" data-a="browser"><i style="background:#2f5fe0">◎</i>Browser</button><button class="icon" data-a="settings"><i style="background:#5b6675">⚙</i>Settings</button><button class="icon" data-a="photos"><i style="background:#e08a2f">▣</i>Photos</button></div></div>`;
    else if(st.page==='browser') b=`<div class="bar">◎ school-portal.example</div><div class="body" style="align-items:center;justify-content:center;text-align:center">${st.conn?'<b style="font-size:18px">School Portal</b><span>Welcome back. Your classes are loaded.</span>':'<b style="font-size:18px">No internet connection</b><span>Check your network settings.</span>'}</div>`;
    else {
      const nets=[['free','FREE_WIFI_CLICK_ME','Open'],['school','School-Student','Secured'],['neighbor','NETGEAR-Apt4B','Secured']];
      b=`<div class="bar">⚙ Settings</div><div class="rows">
        <button class="r" data-a="air"><span>✈ Airplane mode</span>${tog(st.air)}</button>
        <button class="r" data-a="wifi" style="${st.air?'opacity:.5':''}"><span>Wi-Fi ${st.conn?'· School-Student':''}</span>${tog(st.wifi)}</button>
        ${st.wifi&&!st.conn?nets.map(n=>`<button class="r" data-a="net" data-v="${n[0]}" style="padding-left:28px"><span>${n[1]}</span><span>${n[2]}</span></button>`).join(''):''}
        <button class="r" data-a="bt"><span>Bluetooth</span>${tog(false)}</button>
        <button class="r" data-a="reset"><span style="color:#c22e17">Erase all content (factory reset)</span><span>›</span></button></div>`;
    }
    return `<div class="tablet"><div class="screen">${sb}${b}<button class="homebar" data-a="home" style="margin-top:auto">Home</button></div></div>`;
  },
  act(st,a,v){
    if(a==='home'){ st.page='home'; return null; }
    if(a==='settings'){ st.page='settings'; return null; }
    if(a==='photos') return info('Photos opens fine. The tablet itself is working.');
    if(a==='browser'){ st.page='browser'; if(st.conn){ st.done=1; return good('The page loads. Fix confirmed.'); } return info('Still no connection.'); }
    if(a==='air'){ st.air=!st.air; if(st.air){ st.wifi=false; st.conn=false; return info('Airplane mode is on. All wireless signals are off.'); } return good('Airplane mode off. Wireless can turn on again.'); }
    if(a==='wifi'){ if(st.air) return info('Wi-Fi is greyed out. Something is blocking all wireless signals.'); st.wifi=!st.wifi; if(!st.wifi) st.conn=false; return st.wifi?info('Wi-Fi is on. Pick a network.'):null; }
    if(a==='net'){ if(v==='school'){ st.conn=true; return good('Connected to School-Student. Now check that it really works.'); }
      if(v==='free') return bad('Open networks with strange names can spy on what you do. Join only networks you know.');
      return bad('That network belongs to someone else and it is locked. Use your own network.'); }
    if(a==='bt') return info('Bluetooth is for headphones and keyboards. It will not bring back the internet.');
    if(a==='reset') return bad('A factory reset erases everything on the tablet. It is a last resort, never a first step.');
  }
},
{ title:'Incorrect Password', dev:'Laptop', par:60,
  prob:'Your password is river42, all lowercase. You are sure you typed it correctly, but the laptop says it is wrong.',
  hints:['Use the eye button to see what you are really typing.','Passwords treat capital and lowercase letters as different. Look at the keyboard for a light.','Turn off Caps Lock, then type river42 and sign in.'],
  tip:'Before you reset a password, check Caps Lock and look at what you typed. Guessing again and again can lock the account.',
  init:()=>({caps:true,val:'',show:false,tries:0}),
  view(st){
    const s=`<div class="body" style="align-items:center;justify-content:center;background:#20283a;color:#fff;border-radius:4px">
      <div style="width:56px;height:56px;border-radius:50%;background:#5b7be0;display:grid;place-items:center;font-size:24px">S</div><b>Student</b>
      <div style="display:flex;gap:6px;width:min(260px,100%)"><input data-in="pw" id="pw" type="${st.show?'text':'password'}" value="${esc(st.val)}" placeholder="Password" autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1;min-width:0;padding:8px;border-radius:5px;border:0;font:500 14px var(--f-mono);color:#18202c;background:#fff"><button class="sbtn gray" data-a="eye" aria-label="Show password">${st.show?'Hide':'👁'}</button></div>
      <button class="sbtn" data-a="sign">Sign in</button>
      <button data-a="forgot" style="background:none;border:0;color:#a9c0ff;text-decoration:underline;font-size:12px">Forgot password?</button></div>`;
    const keys=['tab','Q','W','E','R','T','Y'].map(k=>`<span class="key">${k}</span>`).join('');
    return laptop(s, `<div class="kbd">${keys}<button class="key" data-a="caps"><span class="led ${st.caps?'g':''}"></span>caps lock</button><span class="key">A</span><span class="key">S</span><span class="key">D</span><span class="key">shift</span></div>`)
      + `<p style="color:var(--dim);font-size:14px;text-align:center">Click the password box and type with your real keyboard.</p>`;
  },
  act(st,a){
    if(a==='eye'){ st.show=!st.show; st._focus='pw'; if(st.show && !st.val) return info('Type something first, then you can see it.'); if(st.show && /[A-Z]/.test(st.val)) return clue('Look at that. The letters are coming out in CAPITALS.'); return null; }
    if(a==='caps'){ st.caps=!st.caps; st.val=''; st._focus='pw'; return st.caps?info('Caps Lock is on.'):good('Caps Lock is off. Now your letters stay lowercase.'); }
    if(a==='sign'){ st._focus='pw'; if(st.val==='river42'){ st.done=1; return good('Signed in.'); }
      st.val=''; st.tries++; if(st.tries>=3){ st.tries=0; return bad('Too many wrong tries. The account is locked for 15 minutes. Stop guessing and look for a cause.'); }
      return info('Incorrect password. '+(3-st.tries)+(3-st.tries===1?' try':' tries')+' left before the account locks.'); }
    if(a==='forgot') return bad('A reset works, but it takes a long time and you already know your password. Check the simple causes first.');
  }
},
{ title:'Music Not Working', dev:'Phone', par:50,
  prob:'You press play on your favorite song. The app looks like it is playing, but no sound comes out of the phone.',
  hints:['Try the volume buttons on the side of the phone.','Volume is up but still silent? Pull down the control panel and see where the sound is being sent.','Switch the audio output to Phone speaker, or turn Bluetooth off.'],
  tip:'One problem can have two causes. Check volume first, then check where the sound is going. Bluetooth headphones in a backpack can steal your audio.',
  init:()=>({vol:0,bt:true,out:'buds',cc:false,menu:false}),
  view(st){
    const loud = st.vol>0 && st.out==='spk';
    let s=`<div class="sbar"><span>3:07</span><span>${st.bt?'ᛒ ':''}${st.vol===0?'🔇':'🔊'} 64%</span></div><button class="homebar" data-a="cc" style="width:150px;margin:0 auto 6px">${st.cc?'Close panel':'Pull down panel'}</button>`;
    if(st.cc) s+=`<div class="cc"><div class="label">Volume ${st.vol}%</div><div class="vol"><i style="width:${st.vol}%"></i></div>
      <button class="r" data-a="bt"><span>Bluetooth${st.bt?' · Jay’s Earbuds':''}</span>${tog(st.bt)}</button>
      <div class="label">Play sound on</div>
      ${st.bt?`<button class="r ${st.out==='buds'?'sel':''}" data-a="out" data-v="buds"><span>Jay’s Earbuds</span><span>${st.out==='buds'?'✓':''}</span></button>`:''}
      <button class="r ${st.out==='spk'?'sel':''}" data-a="out" data-v="spk"><span>Phone speaker</span><span>${st.out==='spk'?'✓':''}</span></button>
      <button class="r" data-a="dnd"><span>Do Not Disturb</span>${tog(false)}</button></div>`;
    else s+=`<div class="body" style="align-items:stretch;text-align:center"><div style="display:flex;justify-content:flex-end"><button class="sbtn gray" data-a="menu" aria-label="Menu">⋮</button></div>
      ${st.menu?`<div class="rows"><button class="r" data-a="restart"><span>Restart phone</span></button><button class="r" data-a="uninstall"><span style="color:#c22e17">Uninstall music app</span></button></div>`:''}
      <div class="art"></div><b style="font-size:16px">Desert Drive</b><span style="opacity:.7">The Saguaros</span><div class="eq"><i></i><i></i><i></i><i></i></div>
      <button class="sbtn" data-a="play" style="align-self:center">❚❚ Playing 1:12 / 3:40</button>
      <span class="label" style="opacity:.8">${loud?'♪ ♫ sound from speaker ♫ ♪':'speaker: silent'}</span></div>`;
    return `<div class="duo"><div class="phone"><div class="screen">${s}</div></div><div class="side"><span class="label" style="color:var(--dim)">Side buttons</span><button class="part" data-a="vup">Volume +</button><button class="part" data-a="vdn">Volume −</button></div></div>`;
  },
  act(st,a,v){
    let r=null;
    if(a==='cc'){ st.cc=!st.cc; st.menu=false; }
    else if(a==='menu'){ st.menu=!st.menu; }
    else if(a==='vup'){ const was=st.vol; st.vol=Math.min(100,st.vol+20); r = was===0 && st.out!=='spk' ? clue('The volume was at zero. It is up now, but the speaker is still silent. Where is the sound going?') : info('Volume '+st.vol+'%.'); }
    else if(a==='vdn'){ st.vol=Math.max(0,st.vol-20); r=info('Volume '+st.vol+'%.'); }
    else if(a==='bt'){ st.bt=!st.bt; st.out=st.bt?'buds':'spk'; r=st.bt?info('Bluetooth on. The phone reconnected to Jay’s Earbuds.'):good('Bluetooth off. Sound goes back to the phone speaker.'); }
    else if(a==='out'){ st.out=v; r=v==='spk'?good('Sound is set to the phone speaker.'):info('Sound is going to the earbuds. They are zipped in a backpack.'); }
    else if(a==='dnd') r=info('Do Not Disturb silences notifications, not music.');
    else if(a==='play'){ r = st.playSeen ? info('The song is playing.') : clue('The timer is moving, so the app is playing. The app is not the problem.'); st.playSeen=1; }
    else if(a==='restart'){ st.menu=false; r=bad('The restart took two minutes, and the phone reconnected to the earbuds right after. Still silent.'); }
    else if(a==='uninstall'){ st.menu=false; r=bad('Deleting the app erases your playlists and does not fix the cause. The app was playing fine.'); }
    if(st.vol>0 && st.out==='spk'){ st.done=1; r=good('Music! It took two fixes: the volume and the output.'); }
    else if(st.out==='spk' && st.vol===0 && r && r.k==='good') r=clue('Sound is set to the speaker, but you still hear nothing. One more thing to check.');
    return r;
  }
},
{ title:'Won’t Turn On', dev:'Laptop', par:60,
  prob:'You press the power button on your laptop and nothing happens. The screen stays black. It was plugged in all night.',
  hints:['Is there a charging light? What is it doing?','Follow the charger cable from the laptop all the way to the wall.','The power strip is switched off. Turn it on, then press the power button.'],
  tip:'Follow the power. Check every connection from the device to the wall before you decide something is broken.',
  init:()=>({strip:false,presses:0}),
  view(st){
    const s = st.done ? `<b style="color:#fff;font-size:20px">Starting up…</b>` : `<span>(black screen)</span>`;
    return laptop(s, `<button class="key" data-a="led"><span class="led ${st.strip?'a':''}"></span>charge light</button><button class="pwr" data-a="power" aria-label="Power button">⏻</button>`, st.done?'':'off')

  const out=new T.Mesh(new T.PlaneGeometry(4,5),new T.MeshBasicMaterial({color:0xffb36b,side:T.DoubleSide})); out.position.set(-3,2,7.2); sc.add(out);
  box(.12,2.6,.3,0x4c2c16,-3.85,1.3,6.05); box(.12,2.6,.3,0x4c2c16,-2.15,1.3,6.05); box(1.8,.12,.3,0x4c2c16,-3,2.63,6.05);
  const win=new T.Mesh(new T.PlaneGeometry(3,1.6),new T.MeshBasicMaterial({color:0xff9a5a,side:T.DoubleSide})); win.position.set(3,2.2,5.98); sc.add(win);
  box(3.2,.1,.1,0xe9e2cf,3,3.02,5.96); box(3.2,.1,.1,0xe9e2cf,3,1.38,5.96); box(.1,1.7,.1,0xe9e2cf,3,2.2,5.96); box(.1,1.7,.1,0xe9e2cf,1.42,2.2,5.96); box(.1,1.7,.1,0xe9e2cf,4.58,2.2,5.96);
  // counter + register
  box(6,1,.9,0x8a5a33,2,.5,1.5); box(6.2,.08,1.1,0xc18a54,2,1.04,1.5);
  box(.7,.45,.5,0x2a2f36,4.3,1.3,1.5); box(.5,.18,.04,0x58f0a6,4.3,1.36,1.24);
  // workbench
  box(4,.95,1,0x6b7780,-3,.475,-5.3); box(4.2,.06,1.1,0x8b979d,-3,.98,-5.3); box(3.6,1.1,.06,0xc9a877,-3,1.95,-5.96);
  [[-4.3,0xe4472b,.5],[-3.6,0x2f5fe0,.7],[-2.9,0xffb224,.4],[-2.2,0x35d08f,.6],[-1.6,0xe4472b,.3]].forEach(t=>box(.14,t[2],.05,t[1],t[0],1.95,-5.9));
  const kit=box(.7,.35,.4,0xe4472b,-4.4,1.19,-5.4);
  // upgrade computer + shelves
  box(.9,1.1,.7,0x2a2f36,5.6,.55,-4.6); const scr=box(.8,.55,.06,0x2f8fe0,5.6,1.45,-4.75); scr.material=new T.MeshBasicMaterial({color:0x4fb0ff});
  box(.6,2.2,5,0x4c2c16,6.6,1.1,.5); [0,1,2,3,4,5,6,7].forEach(i=>box(.4,.35,.4,[0xc4ccd0,0xffe27a,0xe4472b,0x35d08f][i%4],6.45,i%2?1.5:.85,-1.5+(i>>1)*1.25));
  const chairs=[0,1,2].map(i=>{ const g=new T.Group(); box(.55,.1,.55,0x35d08f,0,.45,0,g); box(.1,.75,.55,0x1f8a5e,-.25,.8,0,g); box(.5,.45,.5,0x1f8a5e,0,.22,0,g); g.position.set(-6.55,0,3.8-i*1.1); sc.add(g); return g; });
  const neon=label('I-FIX-IT','#3f7d7b',4.2,1.05,1.6,3.15,-5.98,true), glow=new T.PointLight(0xffb224,0,9); glow.position.set(1.6,3,-4.8); sc.add(glow);

  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>labels.forEach(l=>l.userData.draw()));
  // customer
  const cm=new T.Group(); const body=new T.Mesh(new T.CylinderGeometry(.3,.4,1.25,14),mat(0xe4472b)); body.position.y=.63; cm.add(body);
  const head=new T.Mesh(new T.SphereGeometry(.29,16,12),mat(0xffd66b)); head.position.y=1.52; cm.add(head);
  [-.11,.11].forEach(x=>{ const e=new T.Mesh(new T.SphereGeometry(.04,8,8),new T.MeshBasicMaterial({color:0x1a2422})); e.position.set(x,1.58,.26); cm.add(e); });
  const mouth=box(.16,.03,.03,0x1a2422,0,1.43,.28,cm); mouth.material=new T.MeshBasicMaterial({color:0x1a2422});
  cm.visible=false; sc.add(cm);
  const bar=new T.Group(); const bbg=new T.Mesh(new T.PlaneGeometry(.9,.12),new T.MeshBasicMaterial({color:0x06191a})); const bfill=new T.Mesh(new T.PlaneGeometry(.84,.07),new T.MeshBasicMaterial({color:0x35d08f})); bfill.position.z=.01; bar.add(bbg); bar.add(bfill); bar.visible=false; sc.add(bar);
  // device
  const dev=new T.Group(); dev.visible=false; sc.add(dev);
  const buildDev=d=>{ while(dev.children.length) dev.remove(dev.children[0]);
    if(/Laptop/.test(d)){ box(.6,.04,.42,0xc4ccd0,0,.02,0,dev); const s2=box(.6,.4,.03,0x16191d,0,.22,-.22,dev); s2.rotation.x=-.25; const g=box(.52,.32,.01,0x9fd0ff,0,.22,-.2,dev); g.rotation.x=-.25; g.material=new T.MeshBasicMaterial({color:0x9fd0ff}); }
    else if(/Phone/.test(d)){ box(.2,.03,.38,0x16191d,0,.015,0,dev); const g=box(.17,.01,.33,0x9fd0ff,0,.035,0,dev); g.material=new T.MeshBasicMaterial({color:0x9fd0ff}); }
    else if(/Tablet/.test(d)){ box(.42,.03,.56,0x16191d,0,.015,0,dev); const g=box(.37,.01,.5,0x9fd0ff,0,.035,0,dev); g.material=new T.MeshBasicMaterial({color:0x9fd0ff}); }
    else { box(.5,.3,.4,0xe9edf0,0,.15,0,dev); box(.2,.08,.02,0x0d2b1c,-.1,.2,.21,dev); box(.3,.02,.3,0xffffff,0,.31,0,dev); } };
  const COL=[[-1,5,1.05,1.95],[-5,-1,-5.9,-4.8],[5.15,6.05,-4.95,-4.25],[6.3,7,-2,3]];
  const blocked=(x,z)=>{ if(x<-6.6||x>6.6||z<-5.6||z>5.5) return true; for(const b of COL) if(x>b[0]-.35&&x<b[1]+.35&&z>b[2]-.35&&z<b[3]+.35) return true; return false; };
  const me=W3={r,dead:false,x:2,z:-1,yaw:Math.PI,pitch:-.05,keys:{},t:0,w:0,h:0,cu:null,devState:'',target:null,tLabel:'',
    sync(){ const u=SH.up; chairs.forEach((c,i)=>c.visible=i<u.chairs);
      neon.userData.col=['#3f7d7b','#ffe27a','#ff9ad1','#8dfcff'][u.sign]; neon.userData.draw(); glow.intensity=u.sign?.5+.25*u.sign:0; glow.color.set([0xffb224,0xffb224,0xff4fa3,0x29d9ff][u.sign]);
      kit.scale.setScalar(1+.18*u.tools); kit.material.color.set([0xe4472b,0xe4472b,0x2f5fe0,0xffb224][u.tools]); } };
  const walk=(tx,tz,dt)=>{ const dx=tx-cm.position.x, dz=tz-cm.position.z, d=Math.hypot(dx,dz), st=2.4*dt; if(d<=st){ cm.position.x=tx; cm.position.z=tz; return true; } cm.position.x+=dx/d*st; cm.position.z+=dz/d*st; cm.rotation.y=Math.atan2(dx,dz); return false; };
  function tick(t){
    if(W3!==me||me.dead) return; requestAnimationFrame(tick);
    const dt=Math.min(.05,((t-me.t)||0)/1000); me.t=t;
    const w=wrap.clientWidth,h=wrap.clientHeight; if(w&&h&&(w!==me.w||h!==me.h)){ me.w=w; me.h=h; r.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }
    const k=me.keys; me.yaw+=((k.l?1:0)-(k.r?1:0))*2.3*dt;
    const mv=((k.f?1:0)-(k.b?1:0))*4*dt; if(mv){ const dx=-Math.sin(me.yaw)*mv, dz=-Math.cos(me.yaw)*mv; if(!blocked(me.x+dx,me.z)) me.x+=dx; if(!blocked(me.x,me.z+dz)) me.z+=dz; }
    cam.position.set(me.x,1.6,me.z); cam.rotation.set(me.pitch,me.yaw,0);
    const cu=SH&&SH.cur; let repaint=false;
    if(cu){
      if(cu!==me.cu){ me.cu=cu; cm.position.set(-3,0,5.7); cm.visible=true; body.material.color.set(cu.color); head.material.color.set(0xffd66b); mouth.scale.set(1,1,1); buildDev(cu.c.dev); cu.walk='in'; }

      if(cu.out&&!cu.left){ cu.dev='gone'; head.material.color.set(cu.out.ok?0xffd66b:0xff7a5c); mouth.scale.set(cu.out.ok?1.6:.6,1,1); if(walk(-3,5.7,dt)){ cu.left=true; cm.visible=false; } }
      bar.visible=!!cu.arrived&&!cu.out; if(bar.visible){ const f=clamp(cu.p/cu.max,0,1); bfill.scale.x=Math.max(f,.001); bfill.position.x=-(1-f)*.42; bfill.material.color.set(f<.3?0xe4472b:0x35d08f); bar.position.set(cm.position.x,2.1,cm.position.z); bar.rotation.y=me.yaw; }
      const ds=cu.dev||''; if(ds!==me.devState){ me.devState=ds; dev.visible=ds==='counter'||ds==='hand'||ds==='bench';
        if(ds==='hand'){ cam.add(dev); dev.position.set(.42,-.42,-.95); dev.rotation.set(.15,.35,0); } else { sc.add(dev); dev.rotation.set(0,ds==='bench'?0:Math.PI,0); if(ds==='counter') dev.position.set(.4,1.08,1.5); else dev.position.set(-3,1.01,-5.2); } }
    }

    const cands=[]; if(cu&&cu.arrived&&!cu.out){ const dn=cu.c.dev.toLowerCase();
      if(cu.dev==='hand'&&cu.fixSel!=null) cands.push(['give','Hand the '+dn+' back to '+cu.name,3,2.6,3.3]); else cands.push(['talk','Talk to '+cu.name,3,2.6,3.3]);
      if(cu.dev==='counter') cands.push(['pick','Pick up the '+dn,.4,1.5,2.1]);

    cands.push(['up','Use the upgrade computer',5.6,-4.6,2.6]);

const KEYMAP={KeyW:'f',ArrowUp:'f',KeyS:'b',ArrowDown:'b',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};
document.addEventListener('keydown',e=>{ if(!W3||G.screen!=='shop'||/INPUT|TEXTAREA/.test(e.target.tagName||'')) return;
  if(KEYMAP[e.code]){ W3.keys[KEYMAP[e.code]]=true; e.preventDefault(); }
  else if(e.code==='KeyE'||(e.code==='Space'&&e.target.tagName!=='BUTTON')){ e.preventDefault(); if(!e.repeat) w3Interact(); } });
document.addEventListener('keyup',e=>{ if(W3&&KEYMAP[e.code]) W3.keys[KEYMAP[e.code]]=false; });
if(typeof window.addEventListener==='function') window.addEventListener('blur',()=>{ if(W3) W3.keys={}; });

/* ---------- events ---------- */
const NAV = {
  home(){ G.run++; G.screen='home'; clearInterval(shopIv); w3Stop(); home(); },
  level(v){ startLevel(+v); },
  hint(){ const L=LEVELS[G.li]; if(G.locked||G.hints>=L.hints.length) return; pushLog({k:'hint',m:L.hints[G.hints]}); G.hints++; sfx('clue'); paintPlay(); },
  cert(){ G.run++; w3Stop(); cert(); },
  shop(){ shopStart(); },
  mute(){ mute=!mute; home(); },
  wipe(){ if(G.wipe){ SAVE={name:SAVE.name,best:[],shopBest:0}; persist(); G.wipe=false; } else G.wipe=true; home(); }
};
document.addEventListener('click', e => {
  const t=e.target.closest('[data-a],[data-go],[data-shop]'); if(!t||t.disabled) return;
  if(t.dataset.go!=='wipe') G.wipe=false;
  if(t.dataset.a) doAct(t.dataset.a,t.dataset.v);
  else if(t.dataset.go) NAV[t.dataset.go](t.dataset.v);
  else shopAct(t.dataset.shop,t.dataset.v);
});
document.addEventListener('input', e => {
  const t=e.target;
  if(t.id==='nm'){ SAVE.name=t.value.slice(0,28); persist(); }
  else if(t.dataset.in==='pw' && G.screen==='play'){ let v=t.value; if(G.st.caps) v=v.toUpperCase(); G.st.val=v; t.value=v; }
});
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.dataset && e.target.dataset.in==='pw'){ e.preventDefault(); doAct('sign'); } });
setInterval(()=>{ if(G.screen==='play'&&!G.locked){ const c=document.getElementById('clock'); if(c) c.textContent=fmtT((Date.now()-G.t0)/1000); } },500);
home();
